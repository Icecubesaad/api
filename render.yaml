services:
  - type: web
    name: jobmate-api
    env: node
    buildCommand: npm install && npx prisma generate && npx @nestjs/cli build
    startCommand: node dist/src/main.js
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: jobmate-db
          property: connectionString
